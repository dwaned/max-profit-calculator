---
# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/configuration/
# and in linters documentation

DISABLE:
  - COPYPASTE
  - SPELL

# APPLY_FIXES is disabled: each run used to commit a fresh
# `megalinter-reports/updated_sources/` directory back to the branch, and
# MegaLinter does not clean up the previous run's output before writing the
# next one. After several PRs the path became deeply nested
# (megalinter-reports/updated_sources/megalinter-reports/updated_sources/...)
# and exceeded the filesystem 4096-char limit, causing every subsequent
# `actions/checkout` with `clean: true` to fail with ENAMETOOLONG.
# Manual fixes are still encouraged — they just don't get auto-committed.
APPLY_FIXES: none

DISABLE_LINTERS:
  - REPOSITORY_TRIVY
  - JAVA_PMD
  - CSS_STYLELINT
  - TYPESCRIPT_STANDARD
  - JAVASCRIPT_STANDARD
  - REPOSITORY_GIT_DIFF
  - DOCKERFILE_HADOLINT
  - REPOSITORY_DEVSKIM
  - REPOSITORY_TRUFFLEHOG
  - REPOSITORY_KICS
  - REPOSITORY_GRYPE
  - YAML_YAMLLINT
  - YAML_V8R
  - REPOSITORY_CHECKOV
  - JAVA_CHECKSTYLE
  - ACTION_ACTIONLINT

# Disable the "newline at end of file" rule
ESLINT_RULES:
  eol-last: "off"

MARKDOWN_MARKDOWN_LINK_CHECK_CONFIG_JSON: ".markdown-link-check.json"
