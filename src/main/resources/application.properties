server.port=9095
server.servlet.context-path=/api
# Resolve the client IP via Tomcat's RemoteIpValve, which only honours the
# header on requests from internal proxies (Render's load balancer, the nginx
# container). CF-Connecting-IP is set by Cloudflare in front of Render and by
# nginx in docker compose; both overwrite any client-sent value. X-Forwarded-For
# is not used: Render only appends to it, and its last hop is a Cloudflare edge.
# The rate limiter keys on the resolved address.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=CF-Connecting-IP
# Only health is exposed over HTTP. The Micrometer meters (including the
# Prometheus registry) are still recorded; add "prometheus" here, ideally with
# a separate management.server.port, to let a scraper read them.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Rate limit on /api/calculate (Phase 3 — SEC-01/03)
# Per-IP token bucket via Bucket4j; only /api/calculate is throttled (see RateLimitFilter).
app.ratelimit.enabled=true
app.ratelimit.capacity=10
app.ratelimit.refill-tokens=10
app.ratelimit.refill-period-seconds=1

# CORS allowed origins (comma-separated): local backend, vite dev (5173),
# vite preview (4173, used by reports.yml), docker compose (3000), production.
app.cors.allowed-origins=http://localhost:9095,http://localhost:5173,http://localhost:3000,http://localhost:4173,http://127.0.0.1:4173,https://max-profit-frontend.onrender.com