server.port=9095
server.servlet.context-path=/api
# Resolve the client IP from X-Forwarded-For via Tomcat's RemoteIpValve, which
# only trusts internal proxy hops (Render's load balancer, the nginx container).
# The rate limiter keys on the resolved address, so forged headers are ignored.
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Rate limit on /api/calculate (Phase 3 — SEC-01/03)
# Per-IP token bucket via Bucket4j; only /api/calculate is throttled (see RateLimitFilter).
app.ratelimit.enabled=true
app.ratelimit.capacity=10
app.ratelimit.refill-tokens=10
app.ratelimit.refill-period-seconds=1

# CORS allowed origins (comma-separated)
app.cors.allowed-origins=http://localhost:9095,http://localhost:5173,http://localhost:3000,https://max-profit-frontend.onrender.com