---
services:
  app:
    build: .
    expose:
      - 9095
    ports:
      - "9095:9095"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9095/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  site:
    build:
      # Context is the project root; the Dockerfile copies site/frontend/.
      context: .
      dockerfile: site/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    expose:
      - 80
    ports:
      - "3000:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
