---
services:
  app:
    build: .
    expose:
      - 9095
    ports:
      - "9095:9095"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9095/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  site:
    build:
      # Context is the project root so the multi-stage Dockerfile can read
      # pom.xml + src for the reports stage, then copy site/frontend/ for the
      # React build stage.
      context: .
      dockerfile: site/frontend/Dockerfile
    expose:
      - 80
    ports:
      - "3000:80"
    depends_on:
      - app
    healthcheck:
      # Probe the SPA root first (always 200), then a report file if present.
      # `|| true` keeps the container healthy even if the Maven reports stage
      # fails to generate — the React app still loads.
      test: ["CMD-SHELL", "curl --fail http://localhost:80/ && curl --fail http://localhost:80/reports/checkstyle.html || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
