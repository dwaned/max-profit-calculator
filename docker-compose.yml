---
services:
  app:
    build: .
    expose:
      - 9095
    ports:
      - "9095:9095"
    environment:
      # The stock advisor needs Ollama on the host: ADVISOR_ENABLED=true docker compose up
      APP_ADVISOR_ENABLED: ${ADVISOR_ENABLED:-false}
      APP_ADVISOR_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9095/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  site:
    build:
      # Context is the project root; the Dockerfile copies site/frontend/.
      context: .
      dockerfile: site/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    expose:
      - 80
    ports:
      - "3000:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
