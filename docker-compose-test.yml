---
services:
  app:
    build: .
    image: max-profit-calculator-app:latest
    ports:
      - "9095:9095"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9095/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      # Project root context: the multi-stage Dockerfile reads pom.xml + src
      # for the reports stage, then site/frontend/ for the React build.
      context: .
      dockerfile: site/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
