# This workflow builds service, and runs:
# - Unit tests (Example and Property Based)
# - Mutation tests
# - Web-layer, integration and stress tests (BDD scenarios run against the UI in containers.yml)
# - OWASP Dependency Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

name: Multiple Test Types & OWASP Dependency Check
run-name: Multiple Test Types & OWASP Dependency Check

jobs:
  build-and-test:
    permissions:
      contents: read
      checks: write  # Unit Test Results check run
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build and test (checkstyle, all default tests, coverage gate)
        # `verify` runs every test in the default suite (unit, property-based,
        # web layer, integration, stress) and JaCoCo's coverage check; previously only four
        # hand-picked test classes ran here.
        run: |
          mvn -B clean verify
          TESTS_TOTAL=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "tests=" {} \; | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{sum += $1} END {print sum}')
          TESTS_FAILED=$(find target/surefire-reports -name "TEST-*.xml" -exec grep -h "failures=" {} \; | sed 's/.*failures="\([0-9]*\)".*/\1/' | awk '{sum += $1} END {print sum}')
          {
            echo "### Unit Test Results"
            echo "- Total Tests: $TESTS_TOTAL"
            echo "- Failed Tests: $TESTS_FAILED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report Test Results
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: always()
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
          check_name: "Unit Test Results"
          detailed_summary: true
          include_passed: true
          annotate_notice: false
          require_tests: true
          fail_on_failure: true

      - name: Run Mutation Tests
        id: mutation
        # Fails when the mutation score drops below pitest's mutationThreshold
        # (pom.xml). The summary is written either way.
        run: |
          set +e -o pipefail
          mvn -Ppitest test-compile 2>&1 | tee mutation_output.txt
          status=$?
          TOTAL_MUTATIONS="$(grep -oE "Generated [0-9]+ mutations" mutation_output.txt | grep -oE "[0-9]+" | head -1)"
          KILLED_MUTATIONS="$(grep -oE "mutations Killed [0-9]+" mutation_output.txt | grep -oE "[0-9]+" | head -1)"
          LINE_COVERAGE="$(grep -oE "Line Coverage.*\(([0-9]+%)\)" mutation_output.txt | grep -oE "[0-9]+%" | head -1)"
          NO_COVERAGE="$(grep -oE "Mutations with no coverage [0-9]+" mutation_output.txt | grep -oE "[0-9]+" | head -1)"
          TEST_STRENGTH="$(grep -oE "Test strength [0-9]+%" mutation_output.txt | grep -oE "[0-9]+%" | head -1)"
          {
            echo "### Mutation Testing Results"
            if [ -n "$TOTAL_MUTATIONS" ] && [ "$TOTAL_MUTATIONS" -gt 0 ]; then
              echo "- Total Mutations: ${TOTAL_MUTATIONS}"
              echo "- Mutations Killed: ${KILLED_MUTATIONS}"
              echo "- Mutations Survived: $((TOTAL_MUTATIONS - KILLED_MUTATIONS))"
              echo "- Kill Percentage: $((KILLED_MUTATIONS * 100 / TOTAL_MUTATIONS))%"
              echo "- Line Coverage: ${LINE_COVERAGE}"
              echo "- Mutations with No Coverage: ${NO_COVERAGE}"
              echo "- Test Strength: ${TEST_STRENGTH}"
            else
              echo "Mutation testing did not produce results; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload Mutation Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-test-results
          path: |
            target/pit-reports/**/*
            mutation_output.txt
          retention-days: 30


  security-scan:
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            pom.xml
            src
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Cache OWASP Database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-db-${{ hashFiles('pom.xml') }}
          restore-keys: |
            owasp-nvd-db-

      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:aggregate \
            -Ddependency-check.nvd.api.key="${NVD_API_KEY}" \
            -DskipProvidedScope=true \
            -DskipSystemScope=true \
            -DskipTestScope=true \
            -Dformat=ALL
          if [ -f "target/dependency-check-report.xml" ]; then
            HIGH=$(grep -c '<severity>HIGH</severity>' target/dependency-check-report.xml || echo 0)
            MEDIUM=$(grep -c '<severity>MEDIUM</severity>' target/dependency-check-report.xml || echo 0)
            LOW=$(grep -c '<severity>LOW</severity>' target/dependency-check-report.xml || echo 0)
            {
              echo "### Security Scan Summary"
              echo "- High Risk: $HIGH"
              echo "- Medium Risk: $MEDIUM"
              echo "- Low Risk: $LOW"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: target/dependency-check-report.*
          retention-days: 30

  # Keeps GitHub's dependency graph (and so Dependabot alerts) in sync with the
  # resolved Maven tree. The correlator matches the snapshot submitted by the
  # old "MaxProfitCalculator" job so the stale one is replaced, not duplicated.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Submit Maven dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          correlator: MaxProfitCalculator
