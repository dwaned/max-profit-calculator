---
# Consumer-driven contract tests (Pact) on a GitHub-hosted runner, in one job:
#   frontend consumer tests -> publish pacts to a Pact Broker
#   -> verify the backend (provider) against them -> can-i-deploy.
# The broker is a service container that lives only for this job (SQLite, no
# state between runs), so every check is about this commit's pacts.

name: Contract Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write  # Contract Test Results check run

    services:
      pact-broker:
        image: pactfoundation/pact-broker:3.0.0-pactbroker2.121.2
        ports:
          - 9292:9292
        env:
          PACT_BROKER_DATABASE_URL: sqlite:////tmp/pact_broker.sqlite3
        # 127.0.0.1, not localhost: localhost resolves to ::1 in the image and
        # the broker only listens on IPv4.
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      PACT_BROKER_BASE_URL: http://localhost:9292

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/frontend/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Install Pact CLI
        run: npm install -g @pact-foundation/pact-cli@18.1.2  # zizmor: ignore[adhoc-packages] pinned CLI, not a project dependency

      # --- Consumer ---
      - name: Run frontend Pact tests
        working-directory: site/frontend
        run: |
          npm ci
          npm run test:pact

      - name: Publish pacts to the broker
        working-directory: site/frontend
        run: |
          pact-broker publish pacts/ \
            --broker-base-url="$PACT_BROKER_BASE_URL" \
            --consumer-app-version="$GITHUB_SHA" \
            --tag=latest

      # --- Provider ---
      - name: Build and start the backend
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/max-profit-calculator-1.0-SNAPSHOT.jar > backend.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:9095/api/health > /dev/null; then
              echo "Backend ready on :9095"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready in 60s"
          cat backend.log
          exit 1

      - name: Verify the provider against the broker
        run: |
          mvn -B test -Pcontract-tests \
            -Dpactbroker.host="$PACT_BROKER_BASE_URL" \
            -Dpact.provider.version="$GITHUB_SHA" \
            -Dpact.verifier.publishResults=true

      - name: Report contract test results
        # Fork PRs get a read-only token, so they can't create the check run.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
          check_name: "Contract Test Results"
          detailed_summary: true
          include_passed: true
          annotate_notice: false
          fail_on_failure: true

      # --- Compatibility ---
      - name: Can I deploy?
        run: |
          pact-broker can-i-deploy \
            --broker-base-url="$PACT_BROKER_BASE_URL" \
            --pacticipant frontend --version "$GITHUB_SHA" \
            --pacticipant max-profit-calculator-backend --version "$GITHUB_SHA"
