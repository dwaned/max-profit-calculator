---
name: Container Testing & Security Scan
run-name: Container Testing & Security Scan

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  issues: write
  security-events: write
  packages: read
  checks: write
  pull-requests: write

jobs:
  build-deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build containers
        run: |
          set -e
          echo "Building app..."
          docker compose -f "docker-compose-test.yml" build app
          echo "Building frontend..."
          docker compose -f "docker-compose-test.yml" build frontend
          echo "Listing images..."
          docker images

      - name: Start containers
        run: |
          docker compose -f "docker-compose-test.yml" up -d
          sleep 30

      - name: Wait for app to be healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:9095/api/health > /dev/null 2>&1; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App failed to become healthy"
          docker compose -f "docker-compose-test.yml" logs
          exit 1

      - name: Analyze for critical CVEs with Docker Scout
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1.20.4
        with:
          command: recommendations,cves,quickview
          image: max-profit-calculator-app:latest
          only-severities: critical
          sarif-file: sarif.output.json
          summary: true
          exit-code: true

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Install Playwright browsers
        # -Pplaywright-tests runs the BDD acceptance scenarios, which drive a real
        # Chromium. The standard install command is exposed via the
        # Playwright CLI; running it via exec:java avoids depending on
        # playwright being installed globally. --with-deps installs only the
        # system libraries Chromium needs. Playwright is a test-scope
        # dependency, so exec:java needs classpathScope=test to load it.
        run: mvn -B -Pplaywright-tests exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium" --no-transfer-progress

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: "${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}"
          restore-keys: |
            "${{ runner.os }}-maven-"

      - name: Maven Build & Install
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Run BDD acceptance scenarios through the UI (Playwright)
        run: mvn test -Pplaywright-tests

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cucumber-report
          path: target/cucumber-report/report.html
          retention-days: 30

      # ContainerTests and ApiPerformanceTests start their own Compose stack with
      # Testcontainers, which publishes the same host ports, so stop ours first.
      - name: Stop the stack
        run: docker compose -f docker-compose-test.yml down

      - name: Run system and API performance tests (Testcontainers)
        run: mvn -B test -Pcontainer-tests --no-transfer-progress

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: |
            target/surefire-reports/**/*.xml
            target/failsafe-reports/**/*.xml
          report_individual_runs: true
          check_name: "Playwright Test Results"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            target/surefire-reports/**/*.xml
            target/failsafe-reports/**/*.xml

      - name: Cleanup
        if: always()
        run: docker compose -f "docker-compose-test.yml" down
