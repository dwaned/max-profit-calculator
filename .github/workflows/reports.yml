---
# Regenerates `target/site/*` after `mvn verify site`, copies it into
# `site/frontend/public/reports/`, and opens a PR with the result.
#
# Why: Render hosts the frontend as a Static Site, so the multi-stage
# Dockerfile that runs Maven is ignored. The only path that gets the
# generated reports into the bundle is to commit them under `public/`,
# which Vite copies verbatim into `dist/reports/` at build time.
#
# Why a PR (not a direct push): the repo has a branch protection rule
# requiring changes to main to go through a pull request. Direct bot
# pushes to main get rejected with GH013. The workflow therefore pushes
# to a throwaway `chore/reports-<sha>` branch and opens a PR.
#
# Playwright: the workflow builds the frontend with `vite build`, then
# serves the static output via `vite preview` on a known port so the
# Playwright UI test can drive the real production bundle (not dev
# server) and its results land in surefire-report.html alongside the
# other tests. Chromium is downloaded by the playwright CLI in the
# `Install Playwright browser` step.
#
# Trade-off: reports go stale between regenerations. They are accurate
# at the moment of the last green main build; the timestamp in `index.html`
# makes that obvious.

name: Regenerate Maven reports

on:
  push:
    branches: [main]
    # Only run when source / config changes — never when only the generated
    # reports directory changed (that would be a feedback loop).
    paths:
      - "src/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "checkstyle_suppressions.xml"
      - "site/frontend/**"
  workflow_dispatch:

concurrency:
  group: reports-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.1.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/frontend/package-lock.json

      - name: Build the frontend
        working-directory: site/frontend
        # Use `npm install` (not `npm ci`) because the package-lock can be
        # subtly out of sync after multiple `npm install` rounds even when
        # `npm ci` reports success locally — the CI runner's npm version is
        # stricter. `npm install` reconciles any drift against package.json.
        run: npm install && npm run build

      - name: Start vite preview (background)
        # `vite preview` serves the production build on :4173. The Playwright
        # test points at PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173. We run
        # it in the background so the workflow can continue; `wait-on`
        # below blocks until the server is actually accepting connections.
        working-directory: site/frontend
        run: npx vite preview --port 4173 --host 127.0.0.1 &
        env:
          VITE_API_URL: "http://localhost:8080"  # not used in build, but kept for parity

      - name: Install Playwright browser
        # Playwright reads the Chromium binary from ~/.cache/ms-playwright/.
        # The npm-shipped @playwright/test CLI installs that binary cleanly
        # without needing to wire the test-scope playwright dependency into
        # `mvn exec:java`'s classpath. The same browser is then reused by
        # both the Maven Java test and the Node.js @playwright/test run
        # below — no second download.
        working-directory: site/frontend
        run: |
          npx playwright install chromium

      - name: Wait for vite preview
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              echo "Frontend ready on :4173"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 1
          done
          echo "Frontend did not become ready in 30s"
          exit 1

      - name: Generate Maven reports (incl. Playwright Java test)
        # The prepare-agent goal has to be invoked explicitly because the
        # pom only declares jacoco in <reporting>, not in <build>. Without
        # it no target/jacoco.exec is created and the site plugin has
        # nothing to render into jacoco/index.html.
        # mvn site aborts if the pitest reporting goal can't find
        # target/pit-reports. Pre-create it with a placeholder so the
        # site plugin still aggregates pitest's section with a stub.
        # PlaywrightUITests is INCLUDED here — the previous workflow
        # version excluded it because no browser / frontend was available.
        # Now that we build + serve the frontend in this job, the test
        # runs and its result lands in surefire-report.html.
        # ContainerTests / ApiPerformanceTests / LocalContractVerificationTest
        # / PactBrokerVerificationTest still need Docker / a Pact broker
        # and are excluded.
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p target/pit-reports
          printf '<!DOCTYPE html><html><body><p>skipped</p></body></html>' \
            > target/pit-reports/index.html
          mvn -B -DskipITs -Dpitest.skip=true \
            -Dtest='!ContainerTests,!ApiPerformanceTests,!LocalContractVerificationTest,!PactBrokerVerificationTest' \
            org.jacoco:jacoco-maven-plugin:0.8.8:prepare-agent \
            test \
            org.jacoco:jacoco-maven-plugin:0.8.8:report \
            site -q

      - name: Run Playwright Node tests (HTML reporter)
        # The Java SDK test only writes one row to surefire-report.html.
        # The official Playwright HTML reporter (the one used by
        # `npx playwright test`) produces a self-contained
        # playwright-report/ bundle with per-test traces, screenshots,
        # network logs and the same interactive UI as the official
        # @playwright/test runner. We ship that bundle as
        # public/playwright-report/ so the Reports page can link to it.
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          CI: "1"  # disables html reporter's "open browser" behaviour
        working-directory: site/frontend
        run: |
          npx playwright test --reporter=html || true
          # Don't fail the job if the HTML reporter run had a flake —
          # the surefire run above is the source of truth.

      - name: Copy reports into site/frontend/public
        run: |
          rm -rf site/frontend/public/reports
          rm -rf site/frontend/public/playwright-report
          cp -r target/site site/frontend/public/reports
          # The Playwright HTML reporter writes to playwright-report/ at
          # site/frontend/ (the playwright.config.js runs from there
          # with outputFolder: './playwright-report'). The HTML
          # reporter's index.html references its own assets via
          # relative paths (./data/, ./trace/), so the bundle must
          # sit at the root of the deployed tree at /playwright-report/
          # for those relative links to resolve.
          if [ -d site/frontend/playwright-report ]; then
            cp -r site/frontend/playwright-report site/frontend/public/playwright-report
          fi

      - name: Open PR with regenerated reports
        # Use `git status --porcelain` (not `git diff --quiet`) because the
        # reports directory is brand new on the first run — `git diff` only
        # sees tracked files, so it would report "no changes" and silently
        # skip the very first commit we actually want.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- site/frontend/public/reports)" ]; then
            echo "Reports unchanged, nothing to do"
            exit 0
          fi

          BRANCH="chore/reports-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Add both the Maven site bundle and the Playwright HTML
          # reporter bundle. `git add <dir>` only matches tracked files
          # inside that dir, so we also need to add the playwright-report
          # dir explicitly — it is a sibling of public/reports, not a
          # child. Use a single `git add` with both paths so the commit
          # is atomic.
          git add site/frontend/public/reports site/frontend/public/playwright-report
          git commit -m "chore(reports): regenerate Maven site reports"
          # Force-push because the reports dir is committed on top of the
          # current main SHA on every run; the SHA used in the branch
          # name is the main tip at trigger time but main has usually
          # moved on (other PRs merged) by the time the workflow runs.
          git push --force-with-lease origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(reports): regenerate Maven site reports" \
            --body "Auto-generated by the \`Regenerate Maven reports\` workflow.

          Re-runs \`mvn verify site\` (including the Playwright UI test
          against \`vite preview\` on :4173) and commits the output under
          \`site/frontend/public/reports/\` so Vite ships it at \`/reports/*\`
          on the deployed site."
