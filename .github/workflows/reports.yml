---
# Builds the Maven site reports and the Playwright HTML report, then
# publishes both to GitHub Pages:
#   https://dwaned.github.io/max-profit-calculator/reports/
#   https://dwaned.github.io/max-profit-calculator/playwright-report/
# The frontend's Reports page links there (VITE_REPORTS_URL), so the
# generated output is never committed to the repository.
#
# Playwright: the workflow builds the frontend with `vite build`, starts
# the backend jar on :9095, then serves the static output via `vite
# preview`, which proxies /api to that backend (preview.proxy defaults to
# server.proxy in vite.config.js). The Playwright UI test therefore drives
# the real production bundle against a local backend, and its results
# land in surefire-report.html alongside the other tests.

name: Regenerate Maven reports

on:
  push:
    branches: [main]
    # Only when something that feeds the reports changes.
    paths:
      - "src/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "checkstyle_suppressions.xml"
      - "site/frontend/**"
      - ".github/workflows/reports.yml"
  workflow_dispatch:

# One Pages deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/frontend/package-lock.json

      - name: Build the frontend
        working-directory: site/frontend
        # Use `npm install` (not `npm ci`) because the package-lock can be
        # subtly out of sync after multiple `npm install` rounds even when
        # `npm ci` reports success locally — the CI runner's npm version is
        # stricter. `npm install` reconciles any drift against package.json.
        run: npm install && npm run build
        env:
          # Same-origin API calls, proxied by `vite preview` to :9095.
          VITE_API_URL: /api

      - name: Start backend
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/max-profit-calculator-1.0-SNAPSHOT.jar > backend.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://localhost:9095/api/health > /dev/null; then
              echo "Backend ready on :9095"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become ready in 60s"
          cat backend.log
          exit 1

      - name: Start vite preview (background)
        # `vite preview` serves the production build on :4173. The Playwright
        # test points at PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173. We run
        # it in the background so the workflow can continue; `wait-on`
        # below blocks until the server is actually accepting connections.
        working-directory: site/frontend
        run: npx vite preview --port 4173 --host 127.0.0.1 &

      - name: Install Playwright browser
        # Playwright reads the Chromium binary from ~/.cache/ms-playwright/.
        # The npm-shipped @playwright/test CLI installs that binary cleanly
        # without needing to wire the test-scope playwright dependency into
        # `mvn exec:java`'s classpath. The same browser is then reused by
        # both the Maven Java test and the Node.js @playwright/test run
        # below — no second download.
        working-directory: site/frontend
        run: |
          npx playwright install chromium

      - name: Wait for vite preview
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              echo "Frontend ready on :4173"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 1
          done
          echo "Frontend did not become ready in 30s"
          exit 1

      - name: Generate Maven reports (incl. Playwright Java test)
        # JaCoCo's agent and report run as part of the build (see pom.xml),
        # so target/jacoco.exec exists before the site renders it.
        # mvn site aborts if the pitest reporting goal can't find
        # target/pit-reports. Pre-create it with a placeholder so the
        # site plugin still aggregates pitest's section with a stub.
        # PlaywrightUITests is INCLUDED here — the previous workflow
        # version excluded it because no browser / frontend was available.
        # Now that we build + serve the frontend in this job, the test
        # runs and its result lands in surefire-report.html.
        # ContainerTests / ApiPerformanceTests / LocalContractVerificationTest
        # / PactBrokerVerificationTest still need Docker / a Pact broker
        # and are excluded.
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          mkdir -p target/pit-reports
          printf '<!DOCTYPE html><html><body><p>skipped</p></body></html>' \
            > target/pit-reports/index.html
          mvn -B -DskipITs -Dpitest.skip=true \
            -Dtest='!ContainerTests,!ApiPerformanceTests,!LocalContractVerificationTest,!PactBrokerVerificationTest' \
            test \
            site -q

      - name: Run Playwright Node tests (HTML reporter)
        # The Java SDK test only writes one row to surefire-report.html.
        # The official Playwright HTML reporter (the one used by
        # `npx playwright test`) produces a self-contained
        # playwright-report/ bundle with per-test traces, screenshots,
        # network logs and the same interactive UI as the official
        # @playwright/test runner. It is published to Pages at
        # /playwright-report/ so the Reports page can link to it.
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          CI: "1"  # disables html reporter's "open browser" behaviour
        working-directory: site/frontend
        run: |
          npx playwright test --reporter=html || true
          # Don't fail the job if the HTML reporter run had a flake —
          # the surefire run above is the source of truth.

      - name: Assemble Pages site
        run: |
          mkdir -p pages
          cp -r target/site pages/reports
          if [ -d site/frontend/playwright-report ]; then
            cp -r site/frontend/playwright-report pages/playwright-report
          fi
          # BDD acceptance scenarios (run against the UI in the Maven step above)
          if [ -f target/cucumber-report/report.html ]; then
            mkdir -p pages/cucumber-report
            cp target/cucumber-report/report.html pages/cucumber-report/index.html
          fi
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><title>Max Profit Calculator reports</title>' \
            '<meta http-equiv="refresh" content="0; url=reports/index.html">' \
            '<a href="reports/index.html">Maven site reports</a>' > pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy-reports:
    needs: build-reports
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
