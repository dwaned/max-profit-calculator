---
# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
# Linter selection lives in .mega-linter.yml. Automatic fixes are off: they
# used to be committed back to PR branches and caused runaway nested
# megalinter-reports/ directories (ENAMETOOLONG on checkout).
name: MegaLinter
run-name: MegaLinter checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # MegaLinter posts its summary as a PR comment.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so MegaLinter can diff the PR against main.
          fetch-depth: 0
          persist-credentials: false

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          # Lints only the files changed in the PR; see https://megalinter.io/configuration/
          VALIDATE_ALL_CODEBASE: false
          # Read-only token; zizmor uses it to resolve referenced actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive MegaLinter reports
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
