---
# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
# Linter selection lives in .mega-linter.yml. Automatic fixes are off: they
# used to be committed back to PR branches and caused runaway nested
# megalinter-reports/ directories (ENAMETOOLONG on checkout).
name: MegaLinter
run-name: MegaLinter checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # MegaLinter posts its summary as a PR comment.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so MegaLinter can diff the PR against main.
          fetch-depth: 0
          persist-credentials: false

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        env:
          # Lints only the files changed in the PR; see https://megalinter.io/configuration/
          VALIDATE_ALL_CODEBASE: false
          # Read-only token; zizmor uses it to resolve referenced actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive MegaLinter reports
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
